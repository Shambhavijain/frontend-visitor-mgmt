<header>

  <div class="text-white font-weight-bold">{{ appName }}</div>


  <button class="btn p-0 border-0 bg-transparent" (click)="toggleDropDown($event)" aria-label="User Menu"
    style="width: 40px; height: 40px;">
    <img [src]="userIconPath" alt="User Icon" class="img-fluid rounded-circle" style="width: 100%; height: 100%;">
  </button>

  <div *ngIf="showDropdown" class="dropdown-menu show custom-dropdown" #dropdownMenu>
    <span class="dropdown-item-text"><strong>{{constString.userId}}</strong> {{ userId }}</span>
    <span class="dropdown-item-text"><strong>{{constString.role}}</strong> {{ role }}</span>
    <span *ngIf="role === 'owner'" class="dropdown-item-text"><strong>{{constString.flatno}}</strong> {{ flatno }}</span>
    <span *ngIf="role === 'owner'" class="dropdown-item-text"><strong>{{constString.tower}}</strong> {{ tower }}</span>

    <div *ngIf="role === 'owner'" class="dropdown-divider"></div>

    <button *ngIf="role === 'owner'" class="dropdown-item d-flex justify-content-between align-items-center"
      data-bs-toggle="modal" data-bs-target="#exampleModal">
      {{constString.updateProfile}}
      <img [src]="update_profile" alt="Update Icon" class="icon-small ms-2">
    </button>

    <div class="dropdown-divider"></div>

    <button class="dropdown-item d-flex justify-content-between align-items-center font-small" (click)="logout()">
      {{constString.logoutUser}}
      <img [src]="user_logout" alt="Logout Icon" class="icon-small ms-2">
    </button>
  </div>

</header>
